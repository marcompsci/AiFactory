# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: AICiv
options:
  bundleIdPrefix: ai.civilization
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "X6LZQ3FS36"   # the owner's Apple team (public: it appears in every app it signs)
targets:
  AICiv:
    type: application
    platform: iOS
    sources:
      - path: AICiv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.civilization.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: AICiv/Info.plist
      properties:
        CFBundleDisplayName: AI Civ
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ai.civilization.refresh]
        NSFaceIDUsageDescription: Face ID confirms that you, the owner, approve a release.
        NSLocalNetworkUsageDescription: Connects to your AI Civilization server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # plain HTTP to your own computer on a private network only (Wi-Fi, Personal Hotspot); everything else stays HTTPS
          NSExceptionDomains:
            10.0.0.0/8: { NSExceptionAllowsInsecureHTTPLoads: true }
            172.16.0.0/12: { NSExceptionAllowsInsecureHTTPLoads: true }
            192.168.0.0/16: { NSExceptionAllowsInsecureHTTPLoads: true }
            192.0.0.0/24: { NSExceptionAllowsInsecureHTTPLoads: true }
            169.254.0.0/16: { NSExceptionAllowsInsecureHTTPLoads: true }
  AICivTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AICivTests
    dependencies:
      - target: AICiv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.civilization.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AICiv:
    build:
      targets:
        AICiv: all
        AICivTests: [test]
    test:
      targets: [AICivTests]
