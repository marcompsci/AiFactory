# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: AICiv
options:
  bundleIdPrefix: ai.civilization
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""   # set your Apple team ID to run on a device
targets:
  AICiv:
    type: application
    platform: iOS
    sources:
      - path: AICiv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.civilization.app
        PRODUCT_NAME: AI Civ
        PRODUCT_MODULE_NAME: AICiv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: AICiv/Info.plist
      properties:
        CFBundleDisplayName: AI Civ
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ai.civilization.refresh]
        NSFaceIDUsageDescription: Face ID confirms that you, the owner, approve a release.
        NSLocalNetworkUsageDescription: Connects to your AI Civilization server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  AICivTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AICivTests
    dependencies:
      - target: AICiv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.civilization.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AICiv:
    build:
      targets:
        AICiv: all
        AICivTests: [test]
    test:
      targets: [AICivTests]
