name: iOS
on:
  push:
    branches: [main]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**"]
  workflow_dispatch:
permissions:
  contents: write   # only to publish the generated Xcode project to the ios-xcodeproj branch (never main)
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: brew install xcodegen && xcodegen generate
      - name: Publish the generated Xcode project (branch ios-xcodeproj, for opening on a Mac without xcodegen)
        if: github.event_name != 'pull_request'
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          rm -rf /tmp/xp && mkdir -p /tmp/xp/apps/ios && cp -R apps/ios/AICiv.xcodeproj /tmp/xp/apps/ios/
          cd /tmp/xp && git init -q -b ios-xcodeproj && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Xcode project generated from ${SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-xcodeproj
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run unit tests
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project AICiv.xcodeproj -scheme AICiv -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO test 2>&1 | tee xcodebuild.log
      - name: Build for device (unsigned)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project AICiv.xcodeproj -scheme AICiv -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a xcodebuild.log
      - name: Report compiler errors as annotations
        if: failure()
        working-directory: apps/ios
        run: grep -E "error:|failed \(|XCTAssert" xcodebuild.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Report test totals
        if: always()
        working-directory: apps/ios
        run: |
          grep -E "Executed [0-9]+ tests?, with [0-9]+ failures?" xcodebuild.log | tail -1 | sed 's/^/::notice title=XCTest::/' || true
          grep -E "Test Case .*(passed|failed)" xcodebuild.log | sed -E 's/.*-\[AICivTests\.([A-Za-z]+) ([A-Za-z]+)\]\x27? (passed|failed).*/\1.\2 \3/' | sort -u | tr '\n' ';' | sed 's/^/::notice title=XCTest cases::/'; echo
