name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: pytest (SQLite)
        run: scripts/ci-pytest.sh
  postgres:
    # The same suite against real PostgreSQL 16 with infrastructure/migrations applied by the app's migration runner.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: aiciv }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AICIV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aiciv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: pytest (PostgreSQL)
        run: scripts/ci-pytest.sh tests/unit tests/integration
  sandbox:
    # Agents' tools inside real containers: network none, read-only root, killed on timeout, a whole mission.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: docker build -f infrastructure/docker/sandbox.Dockerfile -t aiciv-sandbox:latest .
      - name: pytest (Docker sandbox)
        env: { AICIV_TEST_DOCKER: "1" }
        run: scripts/ci-pytest.sh tests/integration/test_docker_sandbox.py tests/unit/test_core.py -k "docker or sandbox"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install -r requirements-dev.txt
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test -c tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: tests/e2e/test-results, retention-days: 7 }
