name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: pytest (SQLite)
        run: |
          set +e
          python -m pytest -o addopts="" -q -rfE -p no:cacheprovider 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -30 | sed 's/^/::error::/'
          grep -E "^E  " pytest.log | head -20 | sed 's/^/::error::/'
          exit $status
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install -r requirements-dev.txt
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test -c tests/e2e/playwright.config.ts
